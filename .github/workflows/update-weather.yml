name: METAR/TAF bijwerken

# Haalt elk half uur de actuele METARs en TAFs op van aviationweather.gov
# (server-zijde, dus zonder CORS-beperkingen) voor alle Nederlandse
# vliegvelden, en slaat ze op als metars.json en tafs.json in de repo.
# De decoder op GitHub Pages leest die bestanden rechtstreeks
# (zelfde domein, altijd toegestaan).
#
# Plaats dit bestand in je repository als:
#   .github/workflows/update-weather.yml
#
# De eerste keer (of na elke wijziging) start je hem handmatig via:
#   Actions-tabblad -> "METAR/TAF bijwerken" -> "Run workflow"
# Faalt iets, klap de rode stap open en lees de logregels.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Ruwe METARs en TAFs ophalen
        run: |
          set -e
          UA="metar-taf-decoder/1.0 (GitHub Actions)"

          # Alle Nederlandse vliegvelden: burger + militair.
          # Kleine velden leveren niet altijd een METAR/TAF; ontbrekende
          # codes verschijnen dan simpelweg niet in de JSON-bestanden.
          STATIONS="EHAM,EHRD,EHEH,EHBK,EHGG,EHLE,EHTW,EHSE,EHAL,EHTX,EHHO,EHDR,EHOW,EHTE,EHHV,EHBD,EHMZ,EHTL,EHGR,EHVK,EHLW,EHWO,EHKD,EHDL,EHDP,EHMC"

          fetch() {
            soort="$1"
            bestand="$2"
            for poging in 1 2 3; do
              code=$(curl -sS --max-time 60 -A "$UA" -w '%{http_code}' -o "$bestand" \
                "https://aviationweather.gov/api/data/${soort}?ids=${STATIONS}&format=raw") \
                || code="000"
              echo ">> ophalen ${soort}, poging ${poging}: HTTP ${code}"
              if [ "$code" = "200" ]; then
                echo ">> aantal regels in ${bestand}: $(wc -l < "$bestand")"
                return 0
              fi
              sleep 5
            done
            echo "!! ophalen ${soort} is na 3 pogingen mislukt (laatste HTTP ${code})"
            return 1
          }

          fetch metar metars_raw.txt
          fetch taf tafs_raw.txt

      - name: Omzetten naar JSON-bestanden
        run: |
          python3 - <<'EOF'
          import json, re, sys

          def parse_metars(path):
              d = {}
              with open(path, encoding="utf-8") as f:
                  for line in f:
                      s = line.strip()
                      if not s:
                          continue
                      u = s.upper()
                      if u.startswith("METAR ") or u.startswith("SPECI "):
                          s = s.split(" ", 1)[1]
                          u = s.upper()
                      m = re.match(r"^([A-Z]{4})\s+\d{6}Z", u)
                      if m:
                          d[m.group(1)] = s
              return d

          def parse_tafs(path):
              d = {}
              cur = None
              with open(path, encoding="utf-8") as f:
                  for line in f:
                      s = line.strip()
                      if not s:
                          continue
                      u = s.upper()
                      m = re.match(r"^(?:TAF\s+)?(?:(?:AMD|COR)\s+)?([A-Z]{4})\s+\d{6}Z", u)
                      if m:
                          cur = m.group(1)
                          d[cur] = s
                      elif cur:
                          d[cur] += "\n" + s
              return d

          metars = parse_metars("metars_raw.txt")
          tafs = parse_tafs("tafs_raw.txt")

          print(">> METARs gevonden voor:", sorted(metars.keys()))
          print(">> TAFs gevonden voor:", sorted(tafs.keys()))

          if not metars:
              print("!! geen enkele METAR geparseerd; afbreken")
              sys.exit(1)

          with open("metars.json", "w", encoding="utf-8") as f:
              json.dump(metars, f, ensure_ascii=False, indent=1)
          with open("tafs.json", "w", encoding="utf-8") as f:
              json.dump(tafs, f, ensure_ascii=False, indent=1)
          EOF

      - name: Wijzigingen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metars.json tafs.json
          git diff --cached --quiet || (git commit -m "Actuele METAR/TAF data" && git push)
