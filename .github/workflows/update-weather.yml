name: METAR/TAF data bijwerken

# Haalt elk half uur de actuele METARs en TAFs op van aviationweather.gov
# (server-zijde, dus zonder CORS-beperkingen) en slaat ze op als tafs.json
# en metars.json in de repo. De decoder op GitHub Pages leest die
# bestanden vervolgens rechtstreeks (zelfde domein, altijd toegestaan).
#
# Plaats dit bestand in je repository als:
#   .github/workflows/update-weather.yml
# (in GitHub: Add file -> Create new file, typ de naam met slash erin)
#
# Let op: de eerste keer start je hem handmatig via het tabblad
# "Actions" in je repository -> workflow kiezen -> "Run workflow".

on:
  schedule:
    # Elke 30 minuten (GitHub tijd, UTC). Minimale.delay ~5-15 min is normaal.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: METARs en TAFs ophalen
        run: |
          python3 - <<'EOF'
          import json, urllib.request

          # Nederlandse vliegvelden (burger + militair). Vul gericht aan,
          # of voeg buitenlandse codes toe die je vaak gebruikt.
          stations = [
              "EHAM", "EHRD", "EHEH", "EHBK", "EHGG", "EHLE", "EHTW", "EHSE",
              "EHAL", "EHTX", "EHHO", "EHDR", "EHOW", "EHTE", "EHHV", "EHBD",
              "EHMZ", "EHTL",
              "EHGR", "EHVK", "EHLW", "EHWO", "EHKD", "EHDL", "EHDP", "EHMC"
          ]
          base = "https://aviationweather.gov/api/data/"

          def haal(soort):
              url = base + soort + "?ids=" + ",".join(stations) + "&format=json"
              req = urllib.request.Request(url, headers={"User-Agent": "metar-taf-decoder/1.0"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  data = json.load(r)
              result = {}
              for item in data.get("data", []):
                  icao = item.get("icao", "")
                  raw = item.get("rawText", "")
                  if icao and raw:
                      result[icao] = raw
              return result

          metars = haal("metar")
          tafs = haal("taf")

          with open("metars.json", "w") as f:
              json.dump(metars, f, ensure_ascii=False, indent=1)
          with open("tafs.json", "w") as f:
              json.dump(tafs, f, ensure_ascii=False, indent=1)

          print("METARs opgehaald:", len(metars))
          print("TAFs opgehaald:", len(tafs))
          EOF

      - name: Wijzigingen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metars.json tafs.json
          git diff --cached --quiet || (git commit -m "Actuele METAR/TAF data" && git push)
